name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build Windows release binary
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        run: cargo build --release

      - name: Upload feh-rs.exe artifact
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: feh-rs-windows-x86_64
          path: target/release/feh-rs.exe

      - name: Build macOS release binary (13.0+ / x86_64)
        if: matrix.os == 'macos-latest' && github.event_name == 'push'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: feh-rs-macos-x86_64
          path: target/x86_64-apple-darwin/release/feh-rs
